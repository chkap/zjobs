[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zjobs"
version = "0.5.0"
description = "Bounded Python/ZMQ streaming execution graphs"
requires-python = ">=3.10"
dependencies = ["cloudpickle>=3.0", "pyzmq>=25"]

[project.scripts]
zjobs-agent = "zjobs.agent:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
